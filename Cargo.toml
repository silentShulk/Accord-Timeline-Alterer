[package]
name = "ATA"
version = "0.1.0"
edition = "2024"

[lib]
name = "ata"
path = "src/lib.rs"

[[bin]]
name = "ATA"
path = "src/main.rs"
required-features = ["cli"]

[features]
# `cli` pulls in clap and builds the command line binary.
# A GUI should depend on this crate with `default-features = false`.
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
chrono = {version="0.4.44", features=["serde"]}
clap = { version="4.5.54", features=["derive"], optional = true }
dirs = "6.0.0"
discord-rich-presence = "1.1.0"
serde = { version="1.0.228", features=["derive"] }
serde_json = "1.0.150"
sevenz-rust = "0.6.1"
shellexpand = "3.1.2"
strum = { version="0.28.0", features=["derive"] }
target = "2.1.0"
thiserror = "2.0.18"
unrar = "0.5.8"
walkdir = "2.5.0"
zip = "8.6.0"
