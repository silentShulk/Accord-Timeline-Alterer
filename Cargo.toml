[package]
name = "Accord-Timeline-Alterer"
version = "0.1.0"
edition = "2024"
description = "A multi-platform NieR Automata mod manager"
# documentation
readme = "README.md"
# homepage
repository = "https://github.com/silentShulk/Accord-Timeline-Alterer"
license-file = "LICENSE"
keywords = ["modding", "nier", "automata", "mod", "mod manager", "cli", "backend", "accord"]
# workspace
# build
# links
# exclude
# include
publish = false
# metadata
# default-run

[lib]
name = "ata"
path = "src/lib.rs"

[[bin]]
name = "ATA"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
specta = ["dep:specta"]
discord = ["dep:discord-rich-presence"]

[dependencies]
chrono = {version="0.4.45", features=["serde"]}
clap = { version="4.5.54", features=["derive"], optional = true }
dirs = "6.0.0"
serde = { version="1.0.228", features=["derive"] }
serde_json = "1.0.150"
sevenz-rust = "0.6.1"
shellexpand = "3.1.2"
specta = { version = "=2.0.0-rc.26", features = ["chrono", "derive"], optional = true }
strum = { version="0.28.0", features=["derive"] }
thiserror = "2.0.18"
unrar = "0.5.8"
walkdir = "2.5.0"
zip = "8.6.0"
discord-rich-presence = { version = "1.1.0", optional = true }



[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
